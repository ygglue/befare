name: BeFare
options:
  bundleIdPrefix: app.befare
  deploymentTarget:
    iOS: "17.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  BeFare:
    type: application
    platform: iOS
    sources:
      - BeFare
      # Offline data bundled with the app (generated by pipeline/ and scripts/).
      - path: ../data/build/graph.bin
        buildPhase: resources
      - path: ../data/fares/fares.json
        buildPhase: resources
      - path: ../data/coverage/coverage.geojson
        buildPhase: resources
      - path: ../docs/sources/pp-city-tricycle-ord1185-2021.jpg
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - framework: ../shared/build/XCFrameworks/debug/BeFareCore.xcframework
        embed: false
    info:
      path: BeFare/Info.plist
      properties:
        CFBundleDisplayName: BeFare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.befare.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
